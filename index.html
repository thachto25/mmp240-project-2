<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="site-title">NYC Landmarks</div>
    </header>

    <main>
        <h1>NYC Landmarks Virtual Tour</h1>
        <p class="intro">This site highlights some interesting landmarks across New York City's five boroughs.</p>

        <div class="videoWrapper ratio-16-9">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/_xkg7pNSp9M?si=-ZVEPLCuj8zmnTqG"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <section class="featured-image">
            <h2>Featured Landmark</h2>
            <picture>
                <source media="(min-width: 645px)" srcset="images/pexels-kelsey-caroline-774981359-19122990.jpg">
                <source media="(max-width: 644px)"
                    srcset="images/squares/pexels-kelsey-caroline-774981359-19122990_square.jpg">
                <img src="images/pexels-kelsey-caroline-774981359-19122990.jpg"
                    alt="Wonder Wheel ferris wheel at Coney Island">
            </picture>
        </section>

        <section class="landmarks">
            <h2>NYC Landmarks</h2>
            <div class="landmarks-grid">
                <figure>
                    <img src="images/squares/pexels-kelsey-caroline-774981359-19122990_square.jpg"
                        alt="Wonder Wheel ferris wheel at Coney Island">
                    <figcaption><a href="images/squares/pexels-kelsey-caroline-774981359-19122990_square.jpg">Photo by
                            Kelsey Caroline</a></figcaption>
                </figure>
                <figure>
                    <img src="images/squares/pexels-loquellano-12404963_square.jpg"
                        alt="Roosevelt Island Tramway leaving Manhattan">
                    <figcaption><a href="images/squares/pexels-loquellano-12404963_square.jpg">Photo by Raphael
                            Loquellano</a></figcaption>
                </figure>
                <figure>
                    <img src="images/squares/pexels-malcolmhill-12360516_square.jpg"
                        alt="Yankee Stadium seen from the water with stadium title visible">
                    <figcaption><a href="images/squares/pexels-malcolmhill-12360516_square.jpg">Photo by Malcolm Hill</a>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/squares/pexels-mora-versio-2150673251-34091093_square.jpg"
                        alt="Statue of Liberty from below looking up at it">
                    <figcaption><a href="images/squares/pexels-mora-versio-2150673251-34091093_square.jpg">Photo by Mora
                            Versio</a></figcaption>
                </figure>
                <figure>
                    <img src="images/squares/pexels-tracehudson-2424391_square.jpg"
                        alt="Empire State Building with lower Manhattan in the background">
                    <figcaption><a href="images/squares/pexels-tracehudson-2424391_square.jpg">Photo by Trace Hudson</a>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/squares/praswin-prakashan-YOCN1a1m_dg-unsplash_square.jpg"
                        alt="Staten Island Ferry pulling into the dock">
                    <figcaption><a href="images/squares/praswin-prakashan-YOCN1a1m_dg-unsplash_square.jpg">Photo by Praswin
                            Prakashan</a></figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>Site by Thach To</p>
    </footer>

</body>

</html>
